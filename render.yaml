services:
  - type: web
    name: portfolio-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_VERSION
        value: v1
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: dt5kagxch
      - key: CLOUDINARY_API_KEY
        value: "211187218299895"
      - key: CLOUDINARY_API_SECRET
        value: CJJajcAu53StdkIBFNOv-jeu2BU

databases:
  - name: portfolio-db
    databaseName: portfoliodb
    user: portfolio_user
    plan: free
